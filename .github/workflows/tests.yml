name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the conda environment (environment.yml)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: nifrec
          conda-remove-defaults: "true"

      - name: Install NIFREC and pytest
        run: |
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=8"

      - name: Show versions
        run: |
          python --version
          xtb --version | head -n 20 || true
          python -c "import rdkit, cclib, ase, numpy, pandas; print('rdkit', rdkit.__version__, 'cclib', cclib.__version__, 'ase', ase.__version__, 'numpy', numpy.__version__, 'pandas', pandas.__version__)"

      - name: Run tests
        run: python -m pytest -v
